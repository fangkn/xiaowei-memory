name: 问题反馈
description: 报告小微记忆的采集、图片、导出或界面问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先检查是否已更新扩展并刷新微博页面。
        **不要上传 Cookie、登录令牌、私密微博、完整备份或浏览器配置。**
        截图和错误信息请遮挡真实 UID、昵称、原文链接及图片 URL 查询参数。
        安全漏洞请按照 SECURITY.md 私密报告。
  - type: input
    id: version
    attributes:
      label: 扩展版本
      placeholder: 例如 0.7.3
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 操作系统与浏览器版本
      description: 请填写 Chrome / Edge 完整版本号及安装方式（源码或安装包）。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用合成信息描述，注明当前页面 / 指定月份、PDF / Markdown、是否包含图片。
      placeholder: |
        1. 打开自己的数字 UID 主页
        2. 选择……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 期望与实际结果
      description: 若涉及重试，请说明已完成月份是否被复用，避免上传实际导出文件。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏后的错误信息或截图
      description: 图片问题可以保留协议、域名和错误类别，用占位符替换图片路径、账号及查询参数。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除凭据、真实账号信息及不希望公开的内容。
          required: true
